# PR と main への push で、型チェック・lint・整形・単体テスト・ビルド・E2E を動かす。
# アクションはタグではなくコミットの SHA で固定する（タグの付け替えによるすり替えを防ぐ）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # 既知の脆弱性を調べる。high・critical があれば CI を赤にする（moderate 以下は Dependabot で見る。NORI-36）
      - run: npm audit --audit-level=high
      # 部品表（SBOM）を SPDX 形式で作る。開発用の依存も含める（ビルドに使う道具も供給網の一部のため）
      - run: npm sbom --sbom-format=spdx > sbom.spdx.json
      # SBOM を CI の成果物として 30 日残す（Actions の実行結果の画面からダウンロードできる）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

  e2e:
    runs-on: ubuntu-24.04
    # E2E は 46 件で、CI の機械では 8〜15 分かかる（日によって遅い）。15 分で打ち切られた（PR #49）ので 25 分に
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # CI には GPU がないので、FPS の基準は手元の PC でだけ確かめる（NORI_SKIP_FPS）
      - run: npm run e2e
        env:
          NORI_SKIP_FPS: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
