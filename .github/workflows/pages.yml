# NORI-16：main への push で、ビルドして GitHub Pages に公開する。
# main には PR と CI（check・e2e）が緑のものしか入らない（ルールセット「main を守る」）。
# 権限は job ごとに最小にする（脅威分析 S-04）。アクションはコミットの SHA で固定する。
# 出典：https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# 公開は1つずつ。途中の公開は取り消さない（公開の途中で止めると、壊れた状態が残りうるため）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # 公開する dist/ の中身を記録に残す（何を出したかを後から確かめられるように）
      - run: find dist -type f | sort
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # この job だけが公開できる（pages: write）。id-token は公開の相手を確かめる OIDC のトークンに使う
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
