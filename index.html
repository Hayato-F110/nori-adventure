<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>のりものアドベンチャー</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="ゲーム画面"></canvas>
    <div id="hud" aria-hidden="true"></div>
    <div id="status" class="status" aria-hidden="true">
      <div class="status-stars">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path
            d="M50 6 L62 38 L96 38 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 L38 38 Z"
            fill="#ffd23f"
            stroke="#b8860b"
            stroke-width="5"
            stroke-linejoin="round"
          />
        </svg>
        <span id="star-count">0</span>
      </div>
      <div id="flags" class="status-flags">
        <svg class="status-flag" viewBox="0 0 60 80" aria-hidden="true">
          <path d="M10 6 V76" stroke="#fff" stroke-width="7" stroke-linecap="round" />
          <path d="M14 8 L54 20 L14 34 Z" />
        </svg>
        <svg class="status-flag" viewBox="0 0 60 80" aria-hidden="true">
          <path d="M10 6 V76" stroke="#fff" stroke-width="7" stroke-linecap="round" />
          <path d="M14 8 L54 20 L14 34 Z" />
        </svg>
        <svg class="status-flag" viewBox="0 0 60 80" aria-hidden="true">
          <path d="M10 6 V76" stroke="#fff" stroke-width="7" stroke-linecap="round" />
          <path d="M14 8 L54 20 L14 34 Z" />
        </svg>
      </div>
      <div class="status-clock">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="9" />
          <path d="M50 26 V50 L66 60" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" />
        </svg>
        <span id="time" class="status-time">0</span>
      </div>
    </div>
    <button
      id="quality"
      class="quality"
      type="button"
      aria-label="がしつ じどう（たかい）"
      data-quality="high"
      data-auto="true"
    >
      <svg class="quality-high" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="72" cy="28" r="13" fill="#ffd23f" />
        <path
          d="M6 84 L38 36 L58 64 L70 50 L94 84 Z"
          fill="#3fa34d"
          stroke="#fff"
          stroke-width="5"
          stroke-linejoin="round"
        />
        <path d="M30 48 L38 36 L46 48 Z" fill="#fff" />
      </svg>
      <svg class="quality-low" viewBox="0 0 100 100" aria-hidden="true">
        <path
          d="M6 84 L38 36 L58 64 L70 50 L94 84 Z"
          fill="#8a8f98"
          stroke="#fff"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>
      <!-- 自動のときの印：回る矢印（右下） -->
      <svg class="quality-auto" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#1f6fd1" stroke="#fff" stroke-width="6" />
        <path
          d="M28 54 A22 22 0 0 1 68 38"
          fill="none"
          stroke="#fff"
          stroke-width="9"
          stroke-linecap="round"
        />
        <path
          d="M72 46 A22 22 0 0 1 32 62"
          fill="none"
          stroke="#fff"
          stroke-width="9"
          stroke-linecap="round"
        />
        <path d="M60 26 L72 38 L56 44 Z" fill="#fff" />
        <path d="M40 74 L28 62 L44 56 Z" fill="#fff" />
      </svg>
    </button>
    <!-- 消音のボタン（NORI-31）：スピーカーの絵。消音のときは斜線。押した状態（音あり）を aria-pressed で伝える -->
    <button id="sound" class="sound" type="button" aria-label="おと" aria-pressed="true">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path
          d="M18 38 H34 L54 20 V80 L34 62 H18 Z"
          fill="#fff"
          stroke="#fff"
          stroke-width="4"
          stroke-linejoin="round"
        />
        <path
          class="sound-waves"
          d="M66 36 Q76 50 66 64 M76 26 Q92 50 76 74"
          fill="none"
          stroke="#fff"
          stroke-width="7"
          stroke-linecap="round"
        />
        <path
          class="sound-slash"
          d="M16 16 L84 84"
          stroke="#ff6f59"
          stroke-width="10"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <!-- 保護者の方への入口（NORI-54）：2秒押し続けて離すと、プライバシーポリシーを新しいタブで開く -->
    <a
      id="parent"
      class="parent-link"
      href="./privacy.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ほごしゃの かたへ（プライバシーポリシー）。2びょう おしつづけて はなす"
    >
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="parent-ring" cx="50" cy="50" r="46" />
        <circle cx="38" cy="34" r="10" fill="#fff" />
        <path d="M22 76 Q22 50 38 50 Q54 50 54 76 Z" fill="#fff" />
        <circle cx="66" cy="48" r="7" fill="#fff" />
        <path d="M55 76 Q55 60 66 60 Q77 60 77 76 Z" fill="#fff" />
      </svg>
    </a>
    <!-- ステージ2の始めに、乗る列車を選ぶ（NORI-59）。絵だけ（文字なし）。速さ・操作は3つとも同じ -->
    <div id="train-choice" class="train-choice" hidden role="group" aria-label="のる れっしゃを えらぶ">
      <button type="button" class="train-choice-button" data-train="train" aria-label="きかんしゃ">
        <svg viewBox="0 0 120 70" aria-hidden="true">
          <rect x="8" y="44" width="104" height="8" rx="3" fill="#34343e" />
          <rect x="14" y="26" width="58" height="20" rx="10" fill="#1fa88e" />
          <rect x="68" y="12" width="40" height="34" rx="6" fill="#1fa88e" />
          <rect x="64" y="8" width="48" height="7" rx="3" fill="#e84a5f" />
          <rect x="24" y="10" width="10" height="18" rx="2" fill="#e84a5f" />
          <rect x="78" y="18" width="20" height="12" rx="2" fill="#6fc8ff" />
          <circle cx="30" cy="56" r="8" fill="#2b2b33" />
          <circle cx="90" cy="56" r="8" fill="#2b2b33" />
        </svg>
      </button>
      <button type="button" class="train-choice-button" data-train="train-commuter" aria-label="でんしゃ">
        <svg viewBox="0 0 120 70" aria-hidden="true">
          <rect x="8" y="12" width="104" height="38" rx="8" fill="#fff1d0" />
          <rect x="8" y="36" width="104" height="6" fill="#ff6f59" />
          <rect x="16" y="18" width="16" height="13" rx="2" fill="#6fc8ff" />
          <rect x="40" y="18" width="16" height="13" rx="2" fill="#6fc8ff" />
          <rect x="64" y="18" width="16" height="13" rx="2" fill="#6fc8ff" />
          <rect x="88" y="18" width="16" height="13" rx="2" fill="#6fc8ff" />
          <path d="M52 12 L60 4 L68 12" fill="none" stroke="#3a3a46" stroke-width="3" />
          <circle cx="28" cy="56" r="8" fill="#2b2b33" />
          <circle cx="92" cy="56" r="8" fill="#2b2b33" />
        </svg>
      </button>
      <button type="button" class="train-choice-button" data-train="train-bullet" aria-label="しんかんせん">
        <svg viewBox="0 0 120 70" aria-hidden="true">
          <path
            d="M6 48 L6 22 Q6 14 16 14 L70 14 Q92 14 116 44 L116 48 Z"
            fill="#f7f8fa"
            stroke="#8e97a3"
            stroke-width="2"
          />
          <rect x="12" y="20" width="62" height="10" rx="3" fill="#24345c" />
          <rect x="10" y="34" width="70" height="3" fill="#f2b33d" />
          <circle cx="28" cy="56" r="8" fill="#2b2b33" />
          <circle cx="86" cy="56" r="8" fill="#2b2b33" />
        </svg>
      </button>
    </div>
    <div id="goal" class="goal" hidden role="img" aria-label="ごーる">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path
          d="M50 6 L62 38 L96 38 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 L38 38 Z"
          fill="#ffd23f"
          stroke="#fff"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <!-- クリアの演出（NORI-30）：紙ふぶき（動きを減らす設定では出さない）と、3 秒後の3つのボタン。行き先は JS で入れる -->
    <div id="confetti" class="confetti" hidden aria-hidden="true"></div>
    <div id="clear" class="clear" hidden role="group" aria-label="つぎに なにを する？">
      <a id="clear-again" class="clear-button" href="./" aria-label="もういっかい">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path
            d="M74 30 A30 30 0 1 0 80 56"
            fill="none"
            stroke="#1fa88e"
            stroke-width="11"
            stroke-linecap="round"
          />
          <path d="M60 18 L84 26 L74 48 Z" fill="#1fa88e" />
        </svg>
      </a>
      <a id="clear-next" class="clear-button" href="./" aria-label="つぎ">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M18 40 H56 V22 L88 50 L56 78 V60 H18 Z" fill="#ff9f1c" stroke-linejoin="round" />
        </svg>
      </a>
      <a id="clear-home" class="clear-button" href="./" aria-label="はじめの がめん">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 14 L88 48 H76 V86 H24 V48 H12 Z" fill="#6fa8dc" stroke-linejoin="round" />
          <rect x="42" y="60" width="16" height="26" fill="#fffaf0" />
        </svg>
      </a>
    </div>
    <!-- タイトル画面（NORI-30）：?stage がないときだけ出す。乗り物の絵だけ（文字なし）。ステージ5は NORI-29 でできてから足す -->
    <nav id="title" class="title" hidden aria-label="のりものを えらぶ">
      <a class="title-button" data-stage="1" href="./?stage=1" aria-label="くるま">
        <svg viewBox="0 0 120 80" aria-hidden="true">
          <path d="M10 52 V40 Q10 34 18 33 L34 30 L46 16 H80 L96 32 Q110 34 110 42 V52 Z" fill="#e84a5f" />
          <path d="M50 21 H64 V32 H40 Z M69 21 H78 L89 32 H69 Z" fill="#6fc8ff" />
          <circle cx="32" cy="54" r="11" fill="#2b2b33" />
          <circle cx="88" cy="54" r="11" fill="#2b2b33" />
          <circle cx="32" cy="54" r="4" fill="#c9ccd3" />
          <circle cx="88" cy="54" r="4" fill="#c9ccd3" />
        </svg>
        <svg class="title-star" viewBox="0 0 100 100" aria-hidden="true" hidden>
          <path d="M50 6 L62 38 L96 38 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 L38 38 Z" />
        </svg>
      </a>
      <a class="title-button" data-stage="2" href="./?stage=2" aria-label="れっしゃ">
        <svg viewBox="0 0 120 80" aria-hidden="true">
          <rect x="8" y="52" width="104" height="8" rx="3" fill="#34343e" />
          <rect x="14" y="32" width="58" height="22" rx="10" fill="#1fa88e" />
          <rect x="68" y="16" width="40" height="38" rx="6" fill="#1fa88e" />
          <rect x="64" y="12" width="48" height="7" rx="3" fill="#e84a5f" />
          <rect x="24" y="14" width="10" height="20" rx="2" fill="#e84a5f" />
          <rect x="78" y="22" width="20" height="13" rx="2" fill="#6fc8ff" />
          <circle cx="30" cy="64" r="9" fill="#2b2b33" />
          <circle cx="90" cy="64" r="9" fill="#2b2b33" />
        </svg>
        <svg class="title-star" viewBox="0 0 100 100" aria-hidden="true" hidden>
          <path d="M50 6 L62 38 L96 38 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 L38 38 Z" />
        </svg>
      </a>
      <a class="title-button" data-stage="3" href="./?stage=3" aria-label="ひこうき">
        <svg viewBox="0 0 120 80" aria-hidden="true">
          <path
            d="M8 40 Q8 32 22 32 H92 Q112 34 114 40 Q112 46 92 48 H22 Q8 48 8 40 Z"
            fill="#f7f8fa"
            stroke="#8e97a3"
            stroke-width="2"
          />
          <path d="M50 34 L72 6 H82 L70 34 Z M50 46 L72 74 H82 L70 46 Z" fill="#ffb238" />
          <path d="M12 34 L6 16 H16 L26 32 Z" fill="#ffb238" />
          <rect x="86" y="35" width="12" height="6" rx="2" fill="#6fc8ff" />
        </svg>
        <svg class="title-star" viewBox="0 0 100 100" aria-hidden="true" hidden>
          <path d="M50 6 L62 38 L96 38 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 L38 38 Z" />
        </svg>
      </a>
      <a class="title-button" data-stage="4" href="./?stage=4" aria-label="せんすいてい">
        <svg viewBox="0 0 120 80" aria-hidden="true">
          <path d="M4 70 Q19 62 34 70 T64 70 T94 70 T120 70" fill="none" stroke="#6fc8ff" stroke-width="5" />
          <ellipse cx="60" cy="48" rx="46" ry="18" fill="#ffd23f" stroke="#c99a12" stroke-width="2" />
          <rect x="46" y="18" width="26" height="18" rx="6" fill="#ffd23f" />
          <circle cx="44" cy="48" r="7" fill="#6fc8ff" stroke="#fff" stroke-width="3" />
          <circle cx="66" cy="48" r="7" fill="#6fc8ff" stroke="#fff" stroke-width="3" />
          <path d="M12 40 L4 32 V64 L12 56 Z" fill="#ff6f59" />
          <circle cx="98" cy="20" r="4" fill="#bfe6ff" />
          <circle cx="106" cy="10" r="3" fill="#bfe6ff" />
        </svg>
        <svg class="title-star" viewBox="0 0 100 100" aria-hidden="true" hidden>
          <path d="M50 6 L62 38 L96 38 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 L38 38 Z" />
        </svg>
      </a>
    </nav>
    <div id="rotate" class="rotate" role="img" aria-label="横にしてね">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <rect
          class="rotate-phone"
          x="38"
          y="18"
          width="44"
          height="84"
          rx="8"
          fill="none"
          stroke="#fff"
          stroke-width="7"
        />
        <path
          d="M20 70 A42 42 0 0 1 48 16"
          fill="none"
          stroke="#ffd166"
          stroke-width="7"
          stroke-linecap="round"
        />
        <path
          d="M40 8 L50 16 L40 25"
          fill="none"
          stroke="#ffd166"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <div id="touch" class="touch">
      <div
        id="wheel"
        class="touch-wheel"
        role="slider"
        aria-label="ハンドル"
        aria-valuemin="-1"
        aria-valuemax="1"
        aria-valuenow="0"
      >
        <div id="knob" class="touch-knob">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="10" />
            <circle cx="50" cy="50" r="9" fill="#fff" />
            <path
              d="M50 12 V41 M17 64 L42 54 M83 64 L58 54"
              stroke="#fff"
              stroke-width="9"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>
      <button id="back" class="touch-button touch-back" type="button" aria-label="さがる">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M68 22 L28 50 L68 78 Z" fill="#fff" /></svg>
      </button>
      <button id="go" class="touch-button touch-go" type="button" aria-label="すすむ">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M32 18 L78 50 L32 82 Z" fill="#fff" /></svg>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
